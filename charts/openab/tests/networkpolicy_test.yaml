suite: NetworkPolicy support (opt-in, direct + proxy egress modes)
templates:
  - templates/networkpolicy.yaml

tests:
  - it: renders no NetworkPolicy resource when networkPolicy.enabled is false (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a single agent NetworkPolicy in direct mode (gateway off) with deny-all ingress, DNS scoped to kube-system, and IPv4+IPv6 HTTPS egress
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: kiro
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value: []
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
            ports:
              - protocol: TCP
                port: 443

  - it: renders both agent and gateway NetworkPolicies in direct mode when gateway is deployed, and the agent policy authorizes TCP 8080 to the gateway pod (F2)
    set:
      networkPolicy.enabled: true
      agents.kiro.gateway.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro-gateway
        documentIndex: 1
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: kiro-gateway
        documentIndex: 1
      - contains:
          path: spec.ingress
          content:
            ports:
              - protocol: TCP
                port: 8080
        documentIndex: 1
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openab
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: kiro-gateway
            ports:
              - protocol: TCP
                port: 8080
        documentIndex: 0

  - it: does NOT render a gateway NetworkPolicy or an agent→gateway egress rule when gateway.enabled=true but gateway.deploy=false (F3 regression — matches templates/gateway.yaml condition)
    set:
      networkPolicy.enabled: true
      agents.kiro.gateway.enabled: true
      agents.kiro.gateway.deploy: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openab
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: kiro-gateway
            ports:
              - protocol: TCP
                port: 8080
          any: true

  - it: renders HTTP egress rule (IPv4+IPv6) when egress.allowHttp is true (direct mode)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowHttp: true
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
            ports:
              - protocol: TCP
                port: 80

  - it: omits IPv6 ipBlock when allowIpv6=false (direct mode, IPv4-only cluster) (F8)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowIpv6: false
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
            ports:
              - protocol: TCP
                port: 443
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
          any: true

  - it: falls back to any-namespace DNS when egress.dnsNamespace is empty string (F4 legacy escape hatch)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.dnsNamespace: ""
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53

  - it: restricts agent egress to the designated proxy Service in proxy mode (F5 — enforcement only)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxy
      networkPolicy.egress.proxy.namespace: egress-proxy
      networkPolicy.egress.proxy.podSelector.matchLabels.app: openshell
      networkPolicy.egress.proxy.ports:
        - protocol: TCP
          port: 3128
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: egress-proxy
                podSelector:
                  matchLabels:
                    app: openshell
            ports:
              - protocol: TCP
                port: 3128
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
            ports:
              - protocol: TCP
                port: 443
          any: true

  - it: quotes an all-numeric proxy namespace so it renders as a string, not a YAML integer (F7)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxy
      networkPolicy.egress.proxy.namespace: "1234"
      networkPolicy.egress.proxy.podSelector.matchLabels.app: openshell
      networkPolicy.egress.proxy.ports:
        - protocol: TCP
          port: 3128
    asserts:
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: "1234"

  - it: applies proxy-mode egress to both agent and gateway policies when gateway is deployed
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxy
      networkPolicy.egress.proxy.namespace: egress-proxy
      networkPolicy.egress.proxy.podSelector.matchLabels.app: openshell
      networkPolicy.egress.proxy.ports:
        - protocol: TCP
          port: 3128
      agents.kiro.gateway.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: egress-proxy
                podSelector:
                  matchLabels:
                    app: openshell
            ports:
              - protocol: TCP
                port: 3128
        documentIndex: 0
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: egress-proxy
                podSelector:
                  matchLabels:
                    app: openshell
            ports:
              - protocol: TCP
                port: 3128
        documentIndex: 1

  - it: appends ingress.extraRules verbatim to the agent policy
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.extraRules:
        - from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
          ports:
            - protocol: TCP
              port: 9090
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    name: monitoring
            ports:
              - protocol: TCP
                port: 9090

  - it: locks egress down to only extraRules when allowDns and allowHttps are false (direct mode)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowDns: false
      networkPolicy.egress.allowHttps: false
      networkPolicy.egress.extraRules:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - protocol: TCP
              port: 443
    asserts:
      - notContains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - protocol: TCP
                port: 443

  # ── F1 negative tests: fail-closed validation ─────────────────────────────

  - it: fails rendering when egress.mode is not exactly "direct" or "proxy" (F1)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxxy
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.egress.mode must be exactly "direct" or "proxy" (got "proxxy")'

  - it: fails rendering when mode=proxy but proxy.podSelector is empty (F1)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxy
      networkPolicy.egress.proxy.ports:
        - protocol: TCP
          port: 3128
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.egress.mode=proxy requires networkPolicy.egress.proxy.podSelector.matchLabels or matchExpressions to be non-empty (an empty selector authorizes every pod in the namespace)'

  - it: fails rendering when mode=proxy but proxy.ports is empty (F1)
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.mode: proxy
      networkPolicy.egress.proxy.podSelector.matchLabels.app: openshell
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.egress.mode=proxy requires networkPolicy.egress.proxy.ports to be non-empty (an empty ports list authorizes every port)'
