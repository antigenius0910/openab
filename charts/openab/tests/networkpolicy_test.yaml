suite: NetworkPolicy support (opt-in, direct egress only)
templates:
  - templates/networkpolicy.yaml
  - templates/gateway.yaml

tests:
  - it: renders no NetworkPolicy resource when networkPolicy.enabled is false (default)
    template: templates/networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a single agent NetworkPolicy (gateway off) with deny-all ingress, DNS scoped to kube-system, and IPv4+IPv6 HTTPS egress
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: kiro
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value: []
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
            ports:
              - protocol: TCP
                port: 443

  - it: renders both agent and gateway NetworkPolicies when gateway is deployed, and the agent policy authorizes TCP 8080 to the gateway pod
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      agents.kiro.gateway.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro-gateway
        documentIndex: 1
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: kiro-gateway
        documentIndex: 1
      - contains:
          path: spec.ingress
          content:
            ports:
              - protocol: TCP
                port: 8080
        documentIndex: 1
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openab
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: kiro-gateway
            ports:
              - protocol: TCP
                port: 8080
        documentIndex: 0

  - it: does NOT render a gateway NetworkPolicy or an agent→gateway egress rule when gateway.enabled=true but gateway.deploy=false (matches templates/gateway.yaml condition)
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      agents.kiro.gateway.enabled: true
      agents.kiro.gateway.deploy: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openab-kiro
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: openab
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: kiro-gateway
            ports:
              - protocol: TCP
                port: 8080
          any: true

  - it: renders HTTP egress rule (IPv4+IPv6) when egress.allowHttp is true
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowHttp: true
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
            ports:
              - protocol: TCP
                port: 80

  - it: omits IPv6 ipBlock when allowIpv6=false (IPv4-only cluster)
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowIpv6: false
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
            ports:
              - protocol: TCP
                port: 443
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
          any: true

  - it: falls back to any-namespace DNS when egress.dnsNamespace is empty string (legacy escape hatch)
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.dnsNamespace: ""
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53

  - it: appends ingress.extraRules verbatim to the agent policy
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.ingress.extraRules:
        - from:
            - namespaceSelector:
                matchLabels:
                  name: monitoring
          ports:
            - protocol: TCP
              port: 9090
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    name: monitoring
            ports:
              - protocol: TCP
                port: 9090

  - it: locks egress down to only extraRules when allowDns and allowHttps are false
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.allowDns: false
      networkPolicy.egress.allowHttps: false
      networkPolicy.egress.extraRules:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - protocol: TCP
              port: 443
    asserts:
      - notContains:
          path: spec.egress
          content:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:ec2::254/128
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - protocol: TCP
                port: 443

  - it: uses configurable metadataExclusions for both IPv4 and IPv6 in the HTTPS rule
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.metadataExclusions.ipv4:
        - 169.254.169.254/32
        - 169.254.170.2/32
      networkPolicy.egress.metadataExclusions.ipv6:
        - fd00:beef::254/128
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                    - 169.254.169.254/32
                    - 169.254.170.2/32
              - ipBlock:
                  cidr: ::/0
                  except:
                    - fd00:beef::254/128
            ports:
              - protocol: TCP
                port: 443

  # ── Gateway env / envFrom (general-purpose env injection) ─────────────────

  - it: renders gateway.env into the gateway Deployment
    template: templates/gateway.yaml
    set:
      agents.kiro.gateway.enabled: true
      agents.kiro.gateway.env:
        MY_FLAG: "on"
        RUST_LOG: "openab_gateway=debug"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_FLAG
            value: "on"
        documentIndex: 0

  - it: renders gateway.envFrom on the gateway Deployment
    template: templates/gateway.yaml
    set:
      agents.kiro.gateway.enabled: true
      agents.kiro.gateway.envFrom:
        - secretRef:
            name: gateway-extras
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: gateway-extras
        documentIndex: 0
