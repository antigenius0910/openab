{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- range $name, $cfg := .Values.agents }}
{{- if ne (include "openab.agentEnabled" $cfg) "false" }}
{{- $d := dict "ctx" $ "agent" $name "cfg" $cfg }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openab.agentFullname" $d }}
  labels:
    {{- include "openab.labels" $d | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openab.selectorLabels" $d | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with $np.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    []
    {{- end }}
  egress:
{{ include "openab.networkPolicyEgress" (dict "np" $np) | indent 4 }}
{{- if and (($cfg.gateway).enabled) (ne (($cfg.gateway).deploy | default true | toString) "false") }}
{{- $gwCfg := omit $cfg "nameOverride" }}
{{- $gwD := dict "ctx" $ "agent" (printf "%s-gateway" $name) "cfg" $gwCfg }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openab.agentFullname" $gwD }}
  labels:
    {{- include "openab.labels" $gwD | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openab.selectorLabels" $gwD | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
    {{- with $np.ingress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
{{ include "openab.networkPolicyEgress" (dict "np" $np) | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/* Egress rule set shared by agent and gateway NetworkPolicies.
     Call with: dict "np" .Values.networkPolicy */}}
{{- define "openab.networkPolicyEgress" -}}
{{- $np := .np -}}
{{- if $np.egress.allowDns -}}
- to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
{{- if eq $np.egress.mode "proxy" }}
- to:
{{- if $np.egress.proxy.namespace }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.egress.proxy.namespace }}
      podSelector:
        {{- toYaml $np.egress.proxy.podSelector | nindent 8 }}
{{- else }}
    - podSelector:
        {{- toYaml $np.egress.proxy.podSelector | nindent 8 }}
{{- end }}
{{- with $np.egress.proxy.ports }}
  ports:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- else }}
{{- if $np.egress.allowHttps }}
- to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 169.254.169.254/32
  ports:
    - protocol: TCP
      port: 443
{{- end }}
{{- if $np.egress.allowHttp }}
- to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 169.254.169.254/32
  ports:
    - protocol: TCP
      port: 80
{{- end }}
{{- end }}
{{- with $np.egress.extraRules }}
{{ toYaml . }}
{{- end }}
{{- end }}
